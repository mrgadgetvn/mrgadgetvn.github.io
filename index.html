<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr Gadget Studio - Mobile Games</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 1.2em;
        }
        .apps {
            margin-top: 30px;
        }
        .app-card {
            border: 2px solid #667eea;
            border-radius: 12px;
            padding: 25px;
            margin: 20px 0;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }
        .app-card h2 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .app-card p {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.6;
        }
        .badge {
            display: inline-block;
        }
        .badge img {
            height: 50px;
        }
        footer {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 2px solid #eee;
            text-align: center;
            color: #999;
        }
        footer a {
            color: #667eea;
            text-decoration: none;
            margin: 0 15px;
        }
        footer a:hover {
            text-decoration: underline;
        }
        .coming-soon {
            opacity: 0.6;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Mr Gadget Studio</h1>
        <p class="subtitle">Indie Mobile Game Developer</p>
        
        <div class="apps">
            <div class="app-card">
                <h2>🎣 Pixel Fishing Quest</h2>
                <p>Relax and enjoy the ultimate pixel fishing experience! Catch rare fish, unlock achievements, and explore beautiful pixel art underwater worlds.</p>
                <div class="badge">
                    <a href="https://play.google.com/store/apps/details?id=com.minh.fishingGame" target="_blank">
                        <img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" alt="Get it on Google Play">
                    </a>
                </div>
            </div>
            
            <!-- Uncomment khi có app mới
            <div class="app-card coming-soon">
                <h2>🎮 Next Game</h2>
                <p>Coming soon...</p>
            </div>
            -->
        </div>
        
        <footer>
            <p>
                <a href="privacy-policy.html">Privacy Policy</a>
                <a href="mailto:webmaster0312@gmail.com">Contact</a>
                <a href="https://github.com/mrgadgetvn" target="_blank">GitHub</a>
            </p>
            <p style="margin-top: 15px; font-size: 0.9em;">© 2026 Mr Gadget Studio. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
